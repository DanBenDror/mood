<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood icon sketches</title>
<style>
@font-face { font-family: "La Belle Aurore"; src: url("fonts/la-belle-aurore.woff2") format("woff2"); }
:root { --bg: #15130e; --line: #332f24; --text: #f6f0dc; --muted: #9a9482; --accent: #f1dfa2; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 28px 16px 60px; }
main { max-width: 560px; margin: 0 auto; }
h1 { font: 400 40px/1.1 "La Belle Aurore", cursive; text-align: center; margin: 0 0 6px; }
.lead { color: var(--muted); text-align: center; margin: 0 auto 30px; max-width: 40ch; font-size: 15px; }
h2 { font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 40px 0 4px; text-align: center; }
.set { border-top: 1px solid var(--line); padding: 18px 0 6px; }
.set .name { text-align: center; font-weight: 600; }
.set .name span { color: var(--muted); font-weight: 400; }
.row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; margin-top: 12px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cell svg { width: 100%; max-width: 74px; filter: url(#sketch); }
.cell small { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sketch" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter></svg>
<main>
  <h1>pick your icons</h1>
  <p class="lead">Sketch options for the drinks and drugs questions. The small grey labels are only here to explain the options; the app will show the drawings alone.</p>
  <h2>Drinks</h2><div id="drinks"></div>
  <h2>Drugs</h2><div id="drugs"></div>
</main>
<script>
const svg = (inner) => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const g = (inner, t) => `<g transform="${t}">${inner}</g>`;
const HEAD = '<path d="M22 3.8C34.5 2.5 44.8 12 44.3 24.5C43.8 36.5 34.5 44.8 23 44.2C11.5 43.600 3.200 34.500 3.800 23C4.300 12.500 12.500 4.200 26.500 4.800"/>';
const eye = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="2.300" ry="2.800" stroke-width="2"/>`;
const NONE = '<path d="M23 6C34 5 42.500 13.500 42 24.500C41.500 35 33.500 42.500 23.500 42C13.500 41.500 5.500 33.500 6 23.500C6.500 14 13.500 6.500 26 7"/><path d="M11.500 36.500l25.500-25"/>';

// ---- drinks ----
const bottle = (x, w = 6) => `<path d="M${x - 2} 5.5l4-.3l.3 9.500q${w - 2} 3 ${w - 2} 9l-.3 17.500q-${w} 2.500-${2 * w} 0l-.3-17.500q0-6 ${w - 2}-9z"/><path d="M${x - w} 29.500q${w} 3 ${2 * w}-.500" stroke-width="1.600"/>`;
const pint = (x, w = 6.5) => `<path d="M${x - w} 9l${w * 0.3} 31l${w * 1.4} .3l${w * 0.3}-31.500z"/><path d="M${x - w + 0.5} 16q${w} 2.500 ${2 * w - 1}-.500" stroke-width="1.800"/>`;
const tally = (x) => `<path d="M${x + 0.8} 11l-1.600 26"/>`;
const gate = (x) => tally(x) + tally(x + 6) + tally(x + 12) + tally(x + 18) + `<path d="M${x - 4} 31l27-13"/>`;
const drinks = [
  ['A', 'Bottles', 'one more bottle each step, then a knocked-over one', [
    svg(NONE), svg(bottle(24, 7)), svg(bottle(15) + bottle(33)), svg(bottle(9, 5) + bottle(24, 5) + bottle(39, 5)),
    svg(g(bottle(9, 5) + bottle(24, 5) + bottle(39, 5), 'translate(6 -2) scale(.74)') + g(bottle(24, 6), 'rotate(-80 24 24) translate(-16 2) scale(.8)')),
  ]],
  ['B', 'Glasses', 'one more glass each step, then a stack', [
    svg(g(pint(24, 7), 'rotate(180 24 24)') ), svg(pint(24, 7.5)), svg(pint(14.500) + pint(33.500)), svg(pint(9, 5) + pint(24, 5) + pint(39, 5)),
    svg(g(pint(9, 5) + pint(24, 5) + pint(39, 5), 'translate(0 18) scale(1 .56)') + g(pint(16.500, 5) + pint(31.500, 5), 'translate(0 -2) scale(1 .56)')),
  ]],
  ['C', 'Tally marks', 'like counting on a napkin', [
    svg(NONE), svg(tally(19) + tally(28)), svg(tally(12) + tally(20) + tally(28) + tally(36)), svg(gate(8) + tally(39)),
    svg(g(gate(6), 'translate(0 -3) scale(.86)') + g(tally(30) + tally(36), 'translate(2 -3) scale(.86)') + '<path d="M33 40h10M38 35v10" stroke-width="2.200"/>'),
  ]],
  ['D', 'Getting drunker', 'one face, from sober to wrecked', [
    svg(HEAD + eye(17, 20) + eye(31, 20) + '<path d="M17 31l14-.500"/>'),
    svg(HEAD + eye(17, 20) + eye(31, 19.500) + '<path d="M15 28.500q9 8 18.500-.500"/>'),
    svg(HEAD + eye(17, 20) + '<path d="M27.500 20q3.500-3.500 7.500 0"/><path d="M14.500 30q4.500 6 9 1t10 1"/><path d="M9 27l3 1M36 28l3-1" stroke-width="1.600"/>'),
    svg(HEAD + '<path d="M13 20.500q3.500-3.500 7.500 0M27.500 20q3.500-3.500 7.500 0"/><path d="M15.500 29l17-.500"/><path d="M21 29.500l.300 7q3 3 6 0l-.300-7.500" fill="currentColor" stroke-width="1"/>'),
    svg(HEAD + '<path d="M14 17.500l6.500 6M20.500 17.500l-6.500 6.500M28 17.500l6.500 6M34.500 17l-6.500 6.500"/><path d="M24 32a2 2 0 1 1 2 2a4.500 4.500 0 1 1-4.500-4.500a7 7 0 1 1 7 7"/>'),
  ]],
];
const steps = ['none', '1–2', '3–4', '5–6', '7+'];

// ---- drugs ----
const leaflet = (deg, len) => `<path d="M24 37c-${len * 0.16}-${len * 0.3}-${len * 0.16}-${len * 0.75} 0-${len}c${len * 0.16} ${len * 0.25} ${len * 0.16} ${len * 0.7} 0 ${len}z" transform="rotate(${deg} 24 37)"/>`;
const LEAF = leaflet(0, 31) + leaflet(-38, 25) + leaflet(38, 25) + leaflet(-74, 17) + leaflet(74, 17) + '<path d="M24 37l.500 8"/>';
const PILL = g('<rect x="6" y="17" width="36" height="14" rx="7"/><path d="M24 17.500v13.500"/>', 'rotate(-38 24 24)');
const JOINT = '<path d="M5 37l27-14.500l3.500 6.500l-27.500 12z"/><path d="M32 22.500l6-3l3.500 6.500l-6 3"/><path d="M41 15q-3.500-3 0-6.500t-.500-6" stroke-width="2"/>';
const TABS = '<circle cx="17" cy="19" r="9"/><path d="M11 23l12-8.500"/><circle cx="32" cy="32" r="8"/><path d="M26.500 35l11-6.500"/>';
const CLOUD = '<path d="M13 33q-7-.500-6.500-6.500q.500-5 6-5.500q1-7 8.500-7.500q6.500-.500 9.500 5q7-.500 8 5.500q.500 6.500-6 8.500z"/><path d="M16 39q4 2.500 8 0M28 42q3 2 6 0" stroke-width="2"/>';
const SPARK = '<path d="M24 5l3.500 13.500l13.500 4l-13.500 4l-3.500 13.500l-3.500-13.500l-13.500-4l13.500-4z"/><path d="M39 34l1 4l4 1l-4 1l-1 4l-1-4l-4-1l4-1z" stroke-width="1.800"/>';
const pair = (a, b) => g(a, 'translate(-3 -2) scale(.66)') + g(b, 'translate(19 17) scale(.62)');
const drugs = [
  ['A', 'Leaf and pill', 'the most literal', [svg(NONE), svg(LEAF), svg(PILL), svg(pair(LEAF, PILL))]],
  ['B', 'Joint and tablets', 'what you would actually hold', [svg(NONE), svg(JOINT), svg(TABS), svg(pair(JOINT, TABS))]],
  ['C', 'Smoke and spark', 'abstract: a haze, a spark, or both', [svg(NONE), svg(CLOUD), svg(SPARK), svg(pair(CLOUD, SPARK))]],
];
const dsteps = ['none', 'cannabis', 'other', 'both'];

const draw = (id, sets, labels) => {
  document.getElementById(id).innerHTML = sets.map(([k, name, note, icons]) =>
    `<div class="set"><div class="name">${id === 'drinks' ? 'Drinks' : 'Drugs'} ${k} · ${name} <span>– ${note}</span></div>` +
    `<div class="row" style="--n:${icons.length}">${icons.map((s, i) => `<div class="cell">${s}<small>${labels[i]}</small></div>`).join('')}</div></div>`).join('');
};
draw('drinks', drinks, steps); draw('drugs', drugs, dsteps);
</script>
</body>
</html>
